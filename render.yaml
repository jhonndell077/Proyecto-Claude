services:
  - type: web
    name: pepepedidos-api
    env: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma db push && node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pepepedidos-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://pepepedidos-b4bd0.web.app
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000

databases:
  - name: pepepedidos-db
    databaseName: deliveryapp
    plan: free
    region: oregon
